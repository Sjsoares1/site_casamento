version: '3.8'

services:
  web:
    image: nginx:alpine
    volumes:
      - ./:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "7000:80"
    networks:
      - casamento_net
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    networks:
      - casamento_net
    restart: unless-stopped
    environment:
      - SHEETDB_URL=https://sheetdb.io/api/v1/n9hdghp2xfvt5
      - WHATSAPP_NUMBER=5532988476779
      - PORT=3000

  cloudflared:
    image: cloudflare/cloudflared:latest
    environment:
      - TUNNEL_TRANSPORT_PROTOCOL=http2
    command: tunnel --no-autoupdate run --token eyJhIjoiZDcyMTg2N2E2YjhhYWM0ZjI0ZDRjN2ZmOTc2ZTY3ZDIiLCJ0IjoiOTkwZjliNDEtZTIxOS00NjlkLTljMmUtMDM2NTY4NjAxNDNiIiwicyI6Ik5XRTBZMkZrWVRBdE9HUXpOQzAwTWpJd0xXRmpOV0l0TUdOa01HWTVNVEUzTTJObE5XSXlNek0zTTJFdFlXRTRaaTAwTVRBNUxXRmtNbVl0TkdVNE5UUmtZVEUzT1RFeSJ9    
    networks:
      - casamento_net
    restart: unless-stopped
    depends_on:
      - web

networks:
  casamento_net:
    driver: bridge